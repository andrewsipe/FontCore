[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fontcore"
version = "0.1.0"
description = "Shared font-processing utilities (console, names, TTX, metadata) for Good Font Scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Keep compatible with FontExtractor2's pins (fonttools==4.40, rich==13).
    "fonttools>=4.40.0,<5",
    "rich>=13.0.0,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["FontCore*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
